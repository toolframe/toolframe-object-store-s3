[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-object-store-s3"
version = "0.1.0"
description = "S3-compatible object storage for Toolframe plugins"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ['toolframe-sdk==0.3.0', 'boto3>=1.42,<2']

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-object-store-s3"
Repository = "https://github.com/toolframe/toolframe-object-store-s3"
Documentation = "https://github.com/toolframe/toolframe-object-store-s3#readme"
Issues = "https://github.com/toolframe/toolframe-object-store-s3/issues"

[project.entry-points."toolframe.plugins"]
object-store-s3 = "toolframe_object_store_s3.plugin:plugin"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
